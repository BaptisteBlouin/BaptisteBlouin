name: Tech Brief on profile

# Rafraîchit le digest injecté dans le README du profil, peu après le Worker (11:00/23:00 UTC).
on:
  schedule:
    - cron: '20 11 * * *'
    - cron: '20 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tech-brief
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: node scripts/update-tech-brief.mjs
      - name: Commit & push si changement
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Rien à committer."
          else
            git commit -m "tech-brief: refresh $(date -u +%Y-%m-%d)"
            git push
          fi
